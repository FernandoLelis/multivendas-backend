# =============================================
# CONFIGURAÇÕES GERAIS
# =============================================

server.port=${PORT:8080}

# =============================================
# BANCO DE DADOS (PRODUÇÃO RAILWAY)
# =============================================

# Banco de produção (Railway) - PRIORIDADE MÁXIMA
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# CONFIGURAÇÕES JSON E SEGURANÇA
# =============================================

spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

# JWT
jwt.secret=${JWT_SECRET:minhaChaveSecretaSuperSeguraParaDesenvolvimentoApenasMudeEmProducao}

# =============================================
# LOGGING (PRODUÇÃO)
# =============================================

logging.level.com.fernando.erp_vendas=INFO
logging.level.org.hibernate=WARN

# =============================================
# HEALTH CHECK PARA RAILWAY
# =============================================

# Ativar endpoints de health
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Configuração básica do health check
management.health.db.enabled=true
management.health.diskspace.enabled=true

# =============================================
# OTIMIZAÇÃO PARA RAILWAY FREE (512MB RAM)
# =============================================

# Limitar threads para economizar memória
server.tomcat.max-threads=50
server.tomcat.min-spare-threads=5

# Otimizar conexões de banco
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Otimizar JPA/Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true