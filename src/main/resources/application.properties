# =============================================
# CONFIGURAÇÕES GERAIS
# =============================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
server.port=${PORT:8080}

# =============================================
# BANCO DE DADOS (PRODUÇÃO RAILWAY)
# =============================================

# Banco de produção (Railway) - PRIORIDADE MÁXIMA
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://shinkansen.proxy.rlwy.net:32914/railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:emYmtGxYtgcHbtncAIzoIbNEycbmpbpk}

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================
# CONFIGURAÇÕES JSON E SEGURANÇA
# =============================================

spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

# JWT
jwt.secret=${JWT_SECRET:minhaChaveSecretaSuperSeguraParaDesenvolvimentoApenasMudeEmProducao}

# =============================================
# LOGGING (PRODUÇÃO)
# =============================================

logging.level.com.fernando.erp_vendas=INFO
logging.level.org.hibernate=WARN

# =============================================
# HEALTH CHECK PARA RAILWAY
# =============================================

# Ativar endpoints de health
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Configuração básica do health check
management.health.db.enabled=true
management.health.diskspace.enabled=true

# =============================================
# OTIMIZAÇÃO PARA RAILWAY FREE (512MB RAM)
# =============================================

# Limitar threads para economizar memória
server.tomcat.max-threads=30
server.tomcat.min-spare-threads=3

# Otimizar conexões de banco para Free Plan
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=30000

# Otimizar JPA/Hibernate para pouca memória
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

