# =============================================
# CONFIGURAÇÕES GERAIS - PRODUÇÃO RAILWAY
# =============================================

server.port=${PORT:8080}
spring.profiles.active=prod

# =============================================
# BANCO DE DADOS - CONFIGURAÇÃO CORRETA PARA RAILWAY
# =============================================

# URL do banco (Railway injeta DATABASE_URL)
spring.datasource.url=${DATABASE_URL}

# Driver JDBC PostgreSQL (OBRIGATÓRIO!)
spring.datasource.driver-class-name=org.postgresql.Driver

# Username e password (Railway injeta via variáveis de ambiente)
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}

# Configurações JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================
# JWT SECURITY
# =============================================

jwt.secret=${JWT_SECRET}

# =============================================
# HEALTH CHECK
# =============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true

# =============================================
# OTIMIZAÇÃO PARA PLANO FREE
# =============================================

server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000