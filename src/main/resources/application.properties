# =============================================
# CONFIGURAÇÃO PRINCIPAL - PONTO DE ENTRADA
# =============================================

server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# CONFIGURAÇÕES COMUNS A TODOS OS PERFIS
# =============================================

jwt.secret=${JWT_SECRET:test-secret-key-para-desenvolvimento}
admin.reset.token=${ADMIN_RESET_TOKEN:dev-reset-token-12345}

# ================================================
# LOGGING OTIMIZADO PARA NEON - CRÍTICO!
# ================================================
logging.level.com.fernando.erp_vendas=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN
logging.level.org.springframework=WARN

# =============================================
# CONFIGURAÇÃO BANCO DE DADOS - NEON PRODUCTION
# =============================================

spring.datasource.url=jdbc:postgresql://ep-winter-sky-ad2f0h2g-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&ssl=true&sslfactory=org.postgresql.ssl.DefaultSSLFactory
spring.datasource.username=neondb_owner
spring.datasource.password=npg_4XBPYDqJaE7S
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================
# JPA/HIBERNATE OTIMIZADO PARA NEON - CRÍTICO!
# ================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ================================================
# CONNECTION POOL OTIMIZADO PARA NEON - CRÍTICO!
# ================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# ================================================
# HEALTH CHECKS OTIMIZADOS PARA NEON - CRÍTICO!
# ================================================
management.endpoint.health.probes.enabled=true
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=false

# ================================================
# CACHE DE PRIMEIRO NÍVEL (SIMPLE, SEM RISCO)
# ================================================
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false

# ================================================
# PERFORMANCE GERAL
# ================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json