# =============================================
# CONFIGURAÇÕES GERAIS - PRODUÇÃO RAILWAY
# =============================================

server.port=${PORT:8080}
spring.profiles.active=prod

# =============================================
# BANCO DE DADOS (Railway injeta DATABASE_URL automaticamente)
# =============================================

# NÃO CONFIGURE DATASOURCE AQUI - Railway faz isso via DATABASE_URL
# Deixe o Spring Boot usar a DATABASE_URL do ambiente

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT SECURITY
# =============================================

jwt.secret=${JWT_SECRET:}

# =============================================
# HEALTH CHECK (OBRIGATÓRIO PARA RAILWAY)
# =============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true

# =============================================
# OTIMIZAÇÃO PARA PLANO FREE
# =============================================

# Limitar threads para economizar memória (512MB)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Otimizar HikariCP para plano free
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000