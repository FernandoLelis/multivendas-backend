# =============================================
# CONFIGURAÇÕES GERAIS - RENDER
# =============================================

server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# =============================================
# BANCO DE DADOS - RENDER POSTGRESQL
# =============================================

# Render injeta DATABASE_URL automaticamente
# Use a sintaxe CORRETA para Spring Boot 3
spring.datasource.url=${DATABASE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Se DATABASE_URL não for injetada, tente separado:
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:multivendas}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT SECURITY
# =============================================

jwt.secret=${JWT_SECRET:}

# =============================================
# HEALTH CHECK
# =============================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true