# =============================================
# CONFIGURAÇÕES GERAIS - RENDER
# =============================================

# Porta para Render (usa 10000 ou variável PORT)
server.port=${PORT:10000}

# Profile ativo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# =============================================
# CONFIGURAÇÃO PARA RODAR SEM BANCO (TESTE CRÍTICO)
# =============================================

# ?? DESABILITA INICIALIZAÇÃO DO BANCO TEMPORARIAMENTE
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Se não tiver DATABASE_URL, não tenta conectar
spring.datasource.continue-on-error=true
spring.jpa.hibernate.ddl-auto=none

# =============================================
# BANCO DE DADOS - RENDER POSTGRESQL
# =============================================

# Render injeta DATABASE_URL automaticamente (se existir)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA (só aplica se tiver banco)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT SECURITY
# =============================================

jwt.secret=${JWT_SECRET:test-secret-key-para-desenvolvimento}

# =============================================
# LOGGING PARA DEBUG
# =============================================

logging.level.com.fernando.erp_vendas=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG