# =============================================
# CONFIGURAÇÃO PRINCIPAL - PONTO DE ENTRADA
# =============================================

# Porta (Render usa PORT, local usa 8080)
server.port=${PORT:8080}

# Perfil ativo: 'dev' padrão, 'prod' no Render via variável de ambiente
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# CONFIGURAÇÕES COMUNS A TODOS OS PERFIS
# =============================================

# JWT Secret (usar variável de ambiente em produção)
jwt.secret=${JWT_SECRET:test-secret-key-para-desenvolvimento}

# =============================================
# ? OTIMIZAÇÃO CRÍTICA - REDUÇÃO CONSUMO NEON
# =============================================

# LOGGING REDUZIDO (economiza consultas)
logging.level.com.fernando.erp_vendas=INFO      # REDUZIDO de DEBUG para INFO
logging.level.org.hibernate.SQL=WARN             # SQL apenas warnings
logging.level.org.hibernate.type=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc=WARN

# =============================================
# CONFIGURAÇÃO BANCO DE DADOS - NEON PRODUCTION
# =============================================

# URL JDBC para o Neon Production (CONEXÃO DIRETA)
spring.datasource.url=jdbc:postgresql://ep-winter-sky-ad2f0h2g-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&ssl=true&sslfactory=org.postgresql.ssl.DefaultSSLFactory

# Usuário e senha
spring.datasource.username=neondb_owner
spring.datasource.password=npg_4XBPYDqJaE7S

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# ? CONNECTION POOLING OTIMIZADO PARA NEON
# =============================================

# REDUÇÃO DE CONEXÕES SIMULTÂNEAS
spring.datasource.hikari.maximum-pool-size=5          # REDUZIDO de 10 para 5 (-50%)
spring.datasource.hikari.minimum-idle=1               # REDUZIDO de 5 para 1 (-80%)
spring.datasource.hikari.connection-timeout=30000     # 30 segundos
spring.datasource.hikari.idle-timeout=30000           # REDUZIDO de 300000 para 30000 (-90%)
spring.datasource.hikari.max-lifetime=600000          # 10 minutos (evita reconnect frequente)
spring.datasource.hikari.keepalive-time=45000         # 45 segundos (mantém conexão ativa)

# Configurações específicas para evitar "wakeups" desnecessários
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================
# JPA/HIBERNATE OTIMIZADO
# =============================================

# Dialeto PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL - manter update para desenvolvimento
spring.jpa.hibernate.ddl-auto=update

# SQL reduzido (economiza logs e processamento)
spring.jpa.show-sql=false                            # DESATIVADO para produção
spring.jpa.properties.hibernate.format_sql=false      # DESATIVADO

# Otimizações de performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Cache de segundo nível desativado (usaremos cache de aplicação)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# =============================================
# ? HEALTH CHECKS LEVES (NÃO ACORDAM BANCO)
# =============================================

# Health checks customizados leves
management.endpoint.health.probes.enabled=true
management.endpoint.health.enabled=true

# ?? CRÍTICO: Desativar health checks que consultam banco
management.health.db.enabled=false                   # NÃO consulta banco
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Endpoints de health customizados
management.endpoints.web.exposure.include=health,info

# Timeout reduzido para health checks
management.endpoint.health.show-details=never
management.health.ratelimit.enabled=false

# =============================================
# CACHE DE APLICAÇÃO (SPRING CACHE)
# =============================================

# Habilita cache de aplicação
spring.cache.type=simple
spring.cache.cache-names=produtos,plataformas,fornecedores,dashboard_cache

# Configuração de tempo de cache (em segundos)
spring.cache.simple.time-to-live=300                 # 5 minutos para dados estáticos
spring.cache.simple.cache-null-values=false

# =============================================
# PERFORMANCE E MONITORAMENTO
# =============================================

# Metrics reduzidas
management.metrics.enable.jvm=true
management.metrics.enable.logback=false
management.metrics.enable.process=true
management.metrics.export.simple.enabled=false

# Compression para respostas JSON
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Timeouts
server.servlet.session.timeout=30m
server.connection-timeout=30000

# =============================================
# SEGURANÇA E CORS
# =============================================

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://multivendas-frontend.onrender.com}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# =============================================
# CONFIGURAÇÕES ESPECÍFICAS PARA NEON
# =============================================

# Evitar consultas desnecessárias ao iniciar
spring.jpa.defer-datasource-initialization=false

# Batch processing otimizado
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Query timeout (evita queries longas)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# =============================================
# TOKEN ADMINISTRATIVO
# =============================================

# Token administrativo para reset de senha (APENAS DESENVOLVIMENTO)
admin.reset.token=${ADMIN_RESET_TOKEN:dev-reset-token-12345}

