# =============================================
# CONFIGURAÇÕES GERAIS
# =============================================

# Configuração do servidor
server.port=${PORT:8080}

# =============================================
# BANCO DE DADOS (DESENVOLVIMENTO + PRODUÇÃO)
# =============================================

# Banco de desenvolvimento (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_vendas
spring.datasource.username=postgres
spring.datasource.password=NetyIsis-1286

# Banco de produção (Railway) - SOBRESCREVE desenvolvimento se existir
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/erp_vendas}

# Configurações do JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# ? OTMIIZAÇÕES HIKARI CP - CONNECTION POOL
# =============================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================
# ? OTMIIZAÇÕES JPA/HIBERNATE
# =============================================

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# =============================================
# ? OTMIIZAÇÕES SPRING BOOT (PRODUÇÃO)
# =============================================

# Otimização Tomcat
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=200

# Otimização JSON
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Segurança JPA
spring.jpa.open-in-view=false

# =============================================
# ? SPRING BOOT ACTUATOR (MONITORAMENTO)
# =============================================

management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.info.env.enabled=true

# =============================================
# CONFIGURAÇÕES JSON E SEGURANÇA
# =============================================

# CORS para desenvolvimento e produção
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

# =============================================
# LOGGING
# =============================================

# Logging para desenvolvimento
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.fernando.erp_vendas=INFO

# Logging para produção (mais leve)
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

# =============================================
# JWT SECRET
# =============================================

# JWT Secret (desenvolvimento - EM PRODUÇÃO USE VARIÁVEL DE AMBIENTE)
jwt.secret=minhaChaveSecretaSuperSeguraParaDesenvolvimentoApenasMudeEmProducao

# =============================================
# CONFIGURAÇÕES ESPECÍFICAS RAILWAY
# =============================================

# Otimização para Railway (evita problemas de memória)
spring.main.lazy-initialization=true