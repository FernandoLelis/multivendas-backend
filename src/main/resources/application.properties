# =============================================
# CONFIGURAÇÃO PRINCIPAL - KOYEB + NEON
# =============================================

# Porta (Koyeb usa PORT)
server.port=${PORT:8080}

# Perfil ativo: 'dev' padrão, 'prod' no Koyeb via variável de ambiente
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Nome da aplicação
spring.application.name=multivendas-backend

# =============================================
# SEGURANÇA E AUTENTICAÇÃO
# =============================================

# JWT Secret (usar variável de ambiente em produção)
jwt.secret=${JWT_SECRET:test-secret-key-para-desenvolvimento}
jwt.expiration=86400000 # 24 horas em milissegundos

# Token administrativo para reset de senha (APENAS DESENVOLVIMENTO)
admin.reset.token=${ADMIN_RESET_TOKEN:dev-reset-token-12345}

# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

# =============================================
# CONFIGURAÇÃO BANCO DE DADOS - NEON PRODUCTION
# =============================================

# URL JDBC para o Neon Production (CONEXÃO DIRETA COM POOLER)
spring.datasource.url=jdbc:postgresql://ep-winter-sky-ad2f0h2g-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&prepareThreshold=0

# Usuário e senha (use variáveis de ambiente no Koyeb)
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# CONNECTION POOLING OTIMIZADO PARA NEON (CRÍTICO!)
# =============================================

# HikariCP - Pool de conexões reduzido para Neon
spring.datasource.hikari.maximum-pool-size=3               # REDUZIDO: de 5 para 3
spring.datasource.hikari.minimum-idle=1                   # REDUZIDO: manter apenas 1 idle
spring.datasource.hikari.connection-timeout=30000         # 30 segundos timeout
spring.datasource.hikari.idle-timeout=60000               # 60 segundos idle timeout
spring.datasource.hikari.max-lifetime=300000              # 5 minutos max lifetime
spring.datasource.hikari.connection-test-query=SELECT 1   # Query leve para testar conexão
spring.datasource.hikari.validation-timeout=5000          # 5 segundos validation timeout

# =============================================
# JPA/HIBERNATE OTIMIZADO
# =============================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false                                 # DESLIGADO para produção
spring.jpa.properties.hibernate.format_sql=false          # DESLIGADO para produção
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Desabilitar consultas desnecessárias
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false                             # IMPORTANTE: melhor performance

# =============================================
# LOGGING OTIMIZADO PARA PRODUÇÃO
# =============================================

# Logging principal
logging.level.com.fernando.erp_vendas=INFO                # REDUZIDO: de DEBUG para INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Desabilitar logs pesados
logging.level.org.hibernate.SQL=OFF                       # DESLIGADO SQL logging
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.cache=OFF

# =============================================
# SPRING ACTUATOR OTIMIZADO (HEALTH CHECKS LEVES)
# =============================================

# Habilitar apenas endpoints essenciais
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never             # Não mostrar detalhes
management.endpoint.health.probes.enabled=true

# Desabilitar health checks pesados
management.health.db.enabled=false                        # CRÍTICO: não consulta banco!
management.health.diskspace.enabled=false
management.health.ping.enabled=true                       # Mantém apenas ping

# Configurar health check customizado leve
management.endpoint.health.group.custom.include=ping

# =============================================
# CACHE CONFIGURATION (OTIMIZAÇÃO FUTURA)
# =============================================

# Habilita cache de segundo nível do Hibernate (futuro)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# =============================================
# SERVER CONFIGURATION
# =============================================

# Timeouts do servidor
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=100

# Compressão de resposta
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# =============================================
# SPRING SECURITY OPTIMIZATIONS
# =============================================

# Otimizações de segurança
spring.security.filter.order=10