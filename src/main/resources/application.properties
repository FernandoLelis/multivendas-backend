# =============================================
# CONFIGURAÇÃO PRINCIPAL - PONTO DE ENTRADA
# =============================================

# Porta (Koyeb usa PORT, local usa 8080)
server.port=${PORT:8080}

# Perfil ativo: 'dev' padrão, 'prod' no Koyeb via variável de ambiente
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# CONFIGURAÇÕES COMUNS A TODOS OS PERFIS
# =============================================

# JWT Secret (usar variável de ambiente em produção)
jwt.secret=${JWT_SECRET:test-secret-key-para-desenvolvimento}

# Logging (REDUZIDO para produção)
logging.level.com.fernando.erp_vendas=${LOG_LEVEL:DEBUG}

# Token administrativo para reset de senha (APENAS DESENVOLVIMENTO)
admin.reset.token=${ADMIN_RESET_TOKEN:dev-reset-token-12345}

# =============================================
# CONFIGURAÇÃO BANCO DE DADOS - NEON PRODUCTION
# =============================================

# URL JDBC para o Neon Production (CONEXÃO DIRETA)
spring.datasource.url=jdbc:postgresql://ep-winter-sky-ad2f0h2g-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&prepareThreshold=0

# Usuário e senha (AGORA COM VARIÁVEIS DE AMBIENTE)
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_4XBPYDqJaE7S}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate (DESLIGADO logs SQL para produção)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false  # ? IMPORTANTE: melhor performance

# =============================================
# ??? CONNECTION POOLING OTIMIZADO PARA NEON
# =============================================

# Pool reduzido para economizar horas Neon
spring.datasource.hikari.maximum-pool-size=3              # ? REDUZIDO de 5 para 3
spring.datasource.hikari.minimum-idle=1                   # ? REDUZIDO: apenas 1 conexão idle
spring.datasource.hikari.connection-timeout=30000         # 30 segundos timeout
spring.datasource.hikari.idle-timeout=60000               # ? REDUZIDO: 60 segundos (era 300000)
spring.datasource.hikari.max-lifetime=300000              # 5 minutos máximo
spring.datasource.hikari.connection-test-query=SELECT 1   # Query leve para testar

# =============================================
# ??? HEALTH CHECKS OTIMIZADOS (CRÍTICO PARA NEON)
# =============================================

# Desabilitar health checks pesados que acordam banco desnecessariamente
management.health.db.enabled=false                        # ? DESLIGADO: não consulta banco
management.endpoint.health.show-details=never             # ? SEM detalhes
management.endpoint.health.probes.enabled=true

# =============================================
# ? LOGGING OTIMIZADO PARA PRODUÇÃO
# =============================================

# Desabilitar logs pesados do Hibernate (se SHOW_SQL=false)
logging.level.org.hibernate.SQL=OFF                       # ? DESLIGADO SQL logging
logging.level.org.hibernate.type=OFF                      # ? DESLIGADO type logging