# =============================================
# PERFIL DE PRODUÇÃO - POSTGRESQL NO NEON
# =============================================

# Neon PostgreSQL (Render injeta DATABASE_URL)
# Formato correto: jdbc:postgresql://host:port/database?parametros
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-winter-sky-ad2f0h2g-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_4XBPYDqJaE7S}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool para Neon (serverless)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=NeonHikariPool

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

# Para Neon serverless (evitar idle connections)
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.hikari.autoCommit=false

# Desabilitar validação de schema (Neon pode ter restrições)
spring.jpa.properties.hibernate.hbm2ddl.schema_validation.enabled=false

# =============================================
# CONFIGURAÇÕES ESPECÍFICAS PARA DEPLOY NO RENDER
# =============================================

# Porta (Render usa PORT)
server.port=${PORT:8080}

# CORS para produção (frontend na Vercel)
cors.allowed-origins=${CORS_ORIGINS:https://erpmultivendas.vercel.app}

# Logging otimizado para produção
logging.level.com.fernando.erp_vendas=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF

# JWT Secret (usar variável de ambiente em produção)
jwt.secret=${JWT_SECRET:seu-jwt-secret-aqui}

# Actuator endpoints (segurança)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# =============================================
# CONFIGURAÇÕES DE PERFORMANCE
# =============================================

# Cache de queries
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Batch processing
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Timezone
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# =============================================
# VALIDAÇÃO DE CONEXÃO NEON
# =============================================

# Validação inicial de conexão
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.validation-timeout=5000