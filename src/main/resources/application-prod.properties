# =============================================
# MULTIVENDAS ERP - CONFIGURAÇÃO PRODUÇÃO
# =============================================

# Porta (Koyeb usa PORT)
server.port=${PORT:8080}

# =============================================
# BANCO DE DADOS - NEON.TECH (VARIÁVEIS DE AMBIENTE)
# =============================================

# URL JDBC (use variável DATABASE_URL do Koyeb)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-winter-sky-ad2f0h2g-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb}

# Credenciais (use variáveis do Koyeb)
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# SSL para Neon
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultSSLFactory

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / HIBERNATE
# =============================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# =============================================
# SEGURANÇA / JWT
# =============================================

# JWT Secret (OBRIGATÓRIO via variável JWT_SECRET no Koyeb)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000  # 24 horas

# =============================================
# CORS (use variável ALLOWED_ORIGINS do Koyeb)
# =============================================

cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# =============================================
# LOGGING
# =============================================

logging.level.com.fernando.erp_vendas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# SPRING BOOT
# =============================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =============================================
# DESABILITAR ENDPOINTS TEMPORÁRIOS (SEGURANÇA)
# =============================================

# Desabilitar endpoints de migração/reset em produção
endpoints.migration.enabled=false
endpoints.reset.enabled=false