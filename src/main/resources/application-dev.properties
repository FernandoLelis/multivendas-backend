# =============================================
# PERFIL DE DESENVOLVIMENTO - BANCO H2 EM MEMÓRIA
# =============================================

# H2 Database (em memória, some quando a app para)
spring.datasource.url=jdbc:h2:mem:multivendasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA - Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update  # Cria/atualiza tabelas automaticamente
spring.jpa.show-sql=true              # Mostra SQL no console (ótimo para debug)
spring.jpa.properties.hibernate.format_sql=true

# Para ver os logs do Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE